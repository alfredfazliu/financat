<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Financat">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Financat</title>
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --field:#FAFAFA; --ink:#000000; --muted:#737373; --line:#DBDBDB;
  --accent:#0095F6; --accent-ink:#FFFFFF; --accent-soft:#E0F1FE;
  --grad:linear-gradient(45deg,#FEDA75 0%,#FA7E1E 22%,#D62976 50%,#962FBF 78%,#4F5BD5 100%); --grad-btn:linear-gradient(90deg,#F58529,#DD2A7B 50%,#8134AF);
  --danger:#B3261E; --warn:#A96A00;
  --c1:#1E4FA0; --c2:#C0762A; --c3:#2E7D5B; --c4:#8A4FA3; --c5:#B3443B; --c6:#3A8FA8; --c7:#7A6A2E; --c8:#6B7278;
  --display:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --glass:rgba(255,255,255,.92); --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#000000; --field:#121212; --ink:#F5F5F5; --muted:#A8A8A8; --line:#262626;
    --accent:#0095F6; --accent-ink:#FFFFFF; --accent-soft:#0B2A40;
    --danger:#F08A80; --warn:#E3AE55;
    --c1:#7FA6E8; --c2:#E0A060; --c3:#6CC39B; --c4:#C39BD8; --c5:#E88A80; --c6:#7CC6DA; --c7:#CDBB78; --c8:#A5ACB1;
    --glass:rgba(0,0,0,.92); --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#000000; --field:#121212; --ink:#F5F5F5; --muted:#A8A8A8; --line:#262626;
  --accent:#0095F6; --accent-ink:#FFFFFF; --accent-soft:#0B2A40;
  --danger:#F08A80; --warn:#E3AE55;
  --c1:#7FA6E8; --c2:#E0A060; --c3:#6CC39B; --c4:#C39BD8; --c5:#E88A80; --c6:#7CC6DA; --c7:#CDBB78; --c8:#A5ACB1;
    --glass:rgba(0,0,0,.92); --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
html{padding-top:max(env(safe-area-inset-top,0px),var(--sat,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em}
.projsel{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 30px 7px 14px;font-weight:600;font-size:14px;max-width:60%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}

.hero{display:flex;flex-direction:column;gap:6px;padding-block:4px 8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.total{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.budget{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--danger)}
.budget-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.sample button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.month{display:flex;flex-direction:column;gap:2px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}
.list{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.swipe:first-child{border-top:0}
.swipe-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:600;font-size:14px}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);padding:12px 14px;position:relative;transition:transform .22s ease;touch-action:pan-y}
.row .clip{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-left:4px}
.dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.dot svg{width:20px;height:20px}
.row:active{background:var(--field)}
.list,.card{box-shadow:none}
.btn,.fab,.chip,.lnk{transition:transform .12s ease}
.btn:active,.fab:active,.chip:active,.lnk:active{transform:scale(.96)}
.donut{display:flex;align-items:center;gap:18px}
.donut svg{width:140px;height:140px;flex:none}
.donut .lg{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.donut .lg span{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted)}
.row .a{font-weight:600}
.row>div{min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-size:17px;margin:0;font-weight:600}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.cat-row .bar{grid-column:1/-1;height:6px}
.cat-row .pct{color:var(--muted);font-size:12.5px;margin-left:6px}
.months svg{width:100%;height:auto;display:block}
.months text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.months .v{fill:var(--ink);font-weight:600}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar-in{max-width:520px;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lens{position:absolute;left:0;top:50%;width:0;height:54px;border-radius:27px;background:var(--field);transform:translateY(-50%);pointer-events:none;z-index:0;
  transition:left .32s cubic-bezier(.3,1.35,.5,1),width .32s cubic-bezier(.3,1.35,.5,1),transform .2s ease,box-shadow .2s ease,background .2s ease}
.lens.drag{transition:width .2s ease,transform .2s ease,box-shadow .2s ease,background .2s ease;transform:translateY(-50%) scale(1.14);
  background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(6px) saturate(1.6);backdrop-filter:blur(6px) saturate(1.6);
  box-shadow:0 0 0 1px var(--line),0 6px 20px rgba(0,0,0,.14)}
.tab,.fab{position:relative;z-index:1}
.tab{transition:transform .2s ease}
.tabbar-in.dragging .tab[aria-selected="true"]{transform:scale(1.08)}
.tab{border:0;background:transparent;padding:8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab{color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke-width:2.6}
.fab{width:56px;height:56px;border-radius:18px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border:2px solid var(--ink)!important;width:40px;height:40px;border-radius:11px}
.fab svg{width:22px!important;height:22px!important}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{touch-action:pan-y;background:var(--surface);border-top:1px solid var(--line);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-family:var(--display);font-size:19px}
.x{border:0;background:transparent;color:var(--muted);font-weight:600;padding:6px}
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.amt{font-family:var(--display);font-size:42px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt.zero{color:var(--muted)}
.cats-scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.cats-scroll::-webkit-scrollbar{display:none}
.cats-scroll .chip{flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet>*{flex-shrink:0}
.pad button{height:46px;border:0;border-radius:10px;background:var(--field);font-size:24px;font-weight:500;font-family:var(--display);display:grid;place-items:center;-webkit-user-select:none;user-select:none}
.pad button:active{background:var(--line)}
.pad svg{width:26px;height:26px}
.photo{display:flex;align-items:center;gap:12px}
.photo label{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:15px;padding:6px 0;cursor:pointer}
.photo label svg{width:22px;height:22px}
.photo img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo .x{margin-left:auto}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:0}
.amount-in span{font-family:var(--display);font-size:28px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input,.field select{-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:48px;line-height:48px;background:var(--field);font-size:16px;width:100%;min-width:0;margin:0;display:block;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field{min-width:0}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.btn{border:0;border-radius:8px;padding:12px;font-weight:600;font-size:15px;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.err{color:var(--danger);font-size:13px;margin:0}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--field);border-radius:12px;padding:12px}
.confirm p{margin:0;font-size:14px}
.settings{display:flex;flex-direction:column;gap:12px}
.lnk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:600}
.lnk small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
textarea.csv{width:100%;height:140px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
.report{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{background:#fff!important;color:#111!important;padding:0!important}
  .app,.tabbar,.scrim,.toast{display:none!important}
  .report{display:block;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:10.5pt;color:#111}
  .report h1{font-size:20pt;margin:0 0 2pt}
  .report h2{font-size:12pt;margin:16pt 0 6pt;border-bottom:1.5pt solid #D62976;padding-bottom:3pt;color:#B81F66}
  .report .meta{color:#555;margin:0 0 12pt}
  .report .kpis{display:flex;gap:10pt}
  .report .kpi{flex:1;border:1pt solid #d5d9e0;border-radius:6pt;padding:8pt 10pt}
  .report .kpi b{display:block;font-size:15pt;margin-top:2pt}
  .report .kpi span{color:#555;font-size:9pt;text-transform:uppercase;letter-spacing:.05em}
  .report table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .report th{text-align:left;font-size:9pt;color:#555;text-transform:uppercase;letter-spacing:.04em;border-bottom:1pt solid #999;padding:4pt}
  .report td{padding:4pt;border-bottom:.5pt solid #ddd;vertical-align:top}
  .report td.r,.report th.r{text-align:right;white-space:nowrap}
  .report tr.m td{background:#f0f3f8;font-weight:600}
  .report tfoot td{font-weight:700;border-top:1.5pt solid #111;border-bottom:0}
  .report tr{break-inside:avoid}
  .report .foot{margin-top:14pt;color:#777;font-size:8.5pt}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Financat</div>
    <select class="projsel" id="projSel" aria-label="Projekti"></select>
  </header>

  <div id="sampleNote" class="sample" hidden>
    <span>Këto janë shpenzime shembull, që të shohësh si duket aplikacioni.</span>
    <button id="clearSample" type="button">Fshiji</button>
  </div>

  <section class="hero">
    <div class="eyebrow" id="heroLabel">Shpenzuar gjithsej</div>
    <div class="total num" id="total">0 €</div>
    <div class="sub num" id="heroSub"></div>
    <div class="budget" id="budgetBox" hidden>
      <div class="bar" id="budgetBar"><i></i></div>
      <div class="budget-row num"><span id="budgetUsed"></span><span id="budgetLeft"></span></div>
    </div>
  </section>

  <main id="viewList">
    <div class="chips" id="filterChips" role="toolbar" aria-label="Filtro sipas kategorisë"></div>
    <div id="months"></div>
  </main>

  <main id="viewSummary" hidden>
    <div class="card"><h2>Sipas kategorisë</h2><div class="donut" id="donut"></div><div id="byCat" style="display:flex;flex-direction:column;gap:12px"></div></div>
    <div class="card months" style="margin-top:16px"><h2>Sipas muajit</h2><div id="byMonth"></div></div>
  </main>

  <main id="viewSettings" hidden>
    <div class="settings">
      <div class="card">
        <h2>Projekti</h2>
        <div class="field"><label for="projName">Emri</label><input id="projName" type="text"></div>
        <div class="field"><label for="projBudget">Buxheti (opsional)</label><input id="projBudget" type="number" inputmode="decimal" placeholder="p.sh. 25000"></div>
        <button class="btn" id="saveProj" type="button">Ruaj projektin</button>
      </div>
      <button class="lnk" id="newProj" type="button">+ Projekt i ri<small>P.sh. "Shpenzime ditore" ose "Makina"</small></button>
      <button class="lnk" id="pdfBtn" type="button">Eksporto në PDF<small>Raport me totalet dhe të gjitha shpenzimet. Në iPhone shtyp Share → Save to Files.</small></button>
      <button class="lnk" id="exportBtn" type="button">Eksporto në Excel (CSV)<small>Ruan një skedar me shpenzimet e projektit, që hapet në Excel ose Numbers</small></button>
      <button class="lnk" id="backupBtn" type="button">Ruaj kopje rezervë<small>Ruan të gjitha të dhënat dhe fotot në një skedar. Ruaje në iCloud Drive herë pas here.</small></button>
      <label class="lnk" for="restoreIn" style="cursor:pointer">Rikthe nga kopja rezervë<small>Zëvendëson të dhënat në telefon me ato të skedarit</small></label>
      <input type="file" id="restoreIn" accept=".json,application/json" hidden>
      <div id="restoreBox" class="confirm" hidden>
        <p id="restoreMsg"></p>
        <div class="two"><button class="btn danger" type="button" id="restoreYes">Po, rikthe</button><button class="btn ghost" style="color:var(--ink)" type="button" id="restoreNo">Jo</button></div>
      </div>
    </div>
  </main>
</div>

<nav class="tabbar" aria-label="Navigimi">
  <div class="tabbar-in" role="tablist" id="tabIn">
    <span class="lens" id="lens" aria-hidden="true"></span>
    <div style="display:flex;justify-content:space-around">
      <button class="tab" role="tab" data-view="list" aria-selected="true" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Shpenzimet</button>
      <button class="tab" role="tab" data-view="summary" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Përmbledhja</button>
    </div>
    <button class="fab" id="addBtn" type="button" aria-label="Shto shpenzim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <div style="display:flex;justify-content:space-around">
      <button class="tab" role="tab" data-view="settings" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cilësimet</button>
    </div>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="grab" id="grab"></div>
    <div class="sheet-h" id="sheetHead"><h3 id="formTitle">Shpenzim i ri</h3><button class="x" type="button" id="closeForm">Anulo</button></div>
    <div class="amount-in"><output class="amt num zero" id="fAmount" aria-label="Shuma">0</output><span>€</span></div>
    <div class="cats" id="fCats" role="radiogroup" aria-label="Kategoria"></div>
    <div class="pad" id="pad" aria-label="Tastiera e numrave">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k=",">,</button><button type="button" data-k="0">0</button>
      <button type="button" data-k="del" aria-label="Fshi shifrën"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9l-6 6M11 9l6 6"/></svg></button>
    </div>
    <div class="field"><input id="fNote" type="text" placeholder="Përshkrimi, p.sh. Pllaka për banjën" aria-label="Përshkrimi" autocomplete="off"></div>
    <div class="two">
      <div class="field"><label for="fDate">Data</label><input id="fDate" type="date"></div>
      <div class="field"><label for="fShop">Dyqani / Punëtori</label><input id="fShop" type="text" placeholder="opsional" autocomplete="off"></div>
    </div>
    <div class="photo">
      <label for="fPhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span id="fPhotoLbl">Shto foto të faturës</span></label>
      <input type="file" id="fPhoto" accept="image/*" hidden>
      <img id="fThumb" alt="Fatura" hidden>
      <button class="x" type="button" id="fPhotoDel" hidden>Hiqe</button>
    </div>
    <p class="err" id="fErr" hidden></p>
    <button class="btn" type="submit" id="fSave">Ruaj</button>
    <button class="btn ghost" type="button" id="fDelete" hidden>Fshije shpenzimin</button>
  </form>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden>Kthe mbrapsht</button></div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="Fatura"></div>
<div class="report" id="report" aria-hidden="true"></div>

<script>
(function(){
const KEY='financat.v1';
const CATS=[
  {id:'materiale',n:'Materiale ndërtimi',c:'--c1'},
  {id:'mobilje',n:'Mobilje',c:'--c2'},
  {id:'pajisje',n:'Pajisje',c:'--c3'},
  {id:'puntore',n:'Punëtorë',c:'--c4'},
  {id:'elektrike',n:'Elektrike',c:'--c5'},
  {id:'hidraulike',n:'Hidraulike',c:'--c6'},
  {id:'ngjyrosje',n:'Ngjyrosje',c:'--c7'},
  {id:'tjera',n:'Tjera',c:'--c8'}
];
const IC={
 materiale:'<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
 mobilje:'<path d="M4 18v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6M4 18h16M6 18v2M18 18v2M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>',
 pajisje:'<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12M9 6.5v1M9 13v3"/>',
 puntore:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 elektrike:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 hidraulike:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 ngjyrosje:'<rect x="3" y="3" width="15" height="6" rx="1.5"/><path d="M18 6h2v5h-8v3M11 14h2v7h-2z"/>',
 tjera:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>'
};
const icon=(id,color)=>`<span class="dot" style="background:color-mix(in srgb,var(${color}) 16%,transparent);color:var(${color})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[id]||IC.tjera}</svg></span>`;
const MONTHS=['janar','shkurt','mars','prill','maj','qershor','korrik','gusht','shtator','tetor','nëntor','dhjetor'];
const MSHORT=['Jan','Shk','Mar','Pri','Maj','Qer','Kor','Gus','Sht','Tet','Nën','Dhj'];
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const eur=v=>{const s=Math.abs(v).toFixed(2).split('.');return (v<0?'-':'')+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+s[1]+' €'};
const eur0=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const [y,m,d]=s.split('-');return +d+' '+MONTHS[+m-1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.projects)||!S.projects.length)S={projects:[{id:'banesa',name:'Banesa',budget:0,expenses:[]}],current:'banesa',view:'list'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const proj=()=>S.projects.find(p=>p.id===S.current)||S.projects[0];
let filter='all', editing=null, fCat='materiale', amt='', photoChange=null, thumbURL=null;

let toastAction=null;
function toast(msg,action){
  const t=$('toast');$('toastMsg').textContent=msg;toastAction=action||null;$('toastAct').hidden=!action;t.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;toastAction=null},action?5000:1800);
}
$('toastAct').onclick=()=>{const a=toastAction;toastAction=null;$('toast').hidden=true;if(a)a()};

// Receipt photos live in IndexedDB (localStorage is too small for images).
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('financat',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('photos',mode);const q=fn(t.objectStore('photos'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{get:id=>tx('readonly',s=>s.get(id)),put:(id,b)=>tx('readwrite',s=>s.put(b,id)),del:id=>tx('readwrite',s=>s.delete(id))};
})();
function shrink(file){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.75)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url});
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const dataToBlob=d=>fetch(d).then(r=>r.blob());

// Delete with undo instead of a confirmation step.
let pendingDelete=null;
function finalizeDelete(){if(pendingDelete){const e=pendingDelete.e;pendingDelete=null;if(e.hasPhoto)DB.del(e.id).catch(()=>{})}}
function removeExpense(e){
  finalizeDelete();
  const p=proj(),i=p.expenses.indexOf(e);if(i<0)return;
  p.expenses.splice(i,1);save();render();
  pendingDelete={e};const mine=pendingDelete;
  toast('U fshi '+eur(e.amount),()=>{if(pendingDelete===mine){pendingDelete=null;p.expenses.splice(Math.min(i,p.expenses.length),0,e);save();render()}});
  setTimeout(()=>{if(pendingDelete===mine)finalizeDelete()},5200);
}

function render(){
  const p=proj();
  $('projSel').innerHTML=S.projects.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${esc(x.name)}</option>`).join('')+'<option value="__new">+ Projekt i ri</option>';
  const ex=p.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tot=ex.reduce((s,e)=>s+e.amount,0);
  $('total').textContent=eur(tot);
  $('heroLabel').textContent='Shpenzuar gjithsej · '+p.name;
  const thisM=today().slice(0,7);
  const mTot=ex.filter(e=>e.date.startsWith(thisM)).reduce((s,e)=>s+e.amount,0);
  $('heroSub').textContent=ex.length+(ex.length===1?' shpenzim':' shpenzime')+' · këtë muaj '+eur(mTot);
  $('sampleNote').hidden=!ex.some(e=>e.sample);
  if(p.budget>0){
    $('budgetBox').hidden=false;
    const pct=tot/p.budget*100;
    $('budgetBar').classList.toggle('over',pct>100);
    $('budgetBar').firstElementChild.style.width=Math.min(100,pct)+'%';
    $('budgetUsed').textContent=Math.round(pct)+'% e buxhetit ('+eur0(p.budget)+')';
    $('budgetLeft').textContent=tot<=p.budget?'Mbeten '+eur0(p.budget-tot):'Tejkaluar me '+eur0(tot-p.budget);
  } else $('budgetBox').hidden=true;

  // chips
  const used=CATS.filter(c=>ex.some(e=>e.cat===c.id));
  $('filterChips').innerHTML=`<button class="chip" type="button" data-f="all" aria-pressed="${filter==='all'}">Të gjitha</button>`+
    used.map(c=>`<button class="chip" type="button" data-f="${c.id}" aria-pressed="${filter===c.id}">${c.n}</button>`).join('');
  // list
  const shown=ex.filter(e=>filter==='all'||e.cat===filter);
  if(!shown.length){$('months').innerHTML=`<div class="empty">Ende asnjë shpenzim.<br>Shtyp <b>+</b> për të shtuar të parin.</div>`}
  else{
    const groups={};shown.forEach(e=>{(groups[e.date.slice(0,7)]=groups[e.date.slice(0,7)]||[]).push(e)});
    $('months').innerHTML=Object.keys(groups).sort().reverse().map(k=>{
      const g=groups[k],[y,m]=k.split('-');
      return `<div class="month"><div class="month-h"><span>${MONTHS[+m-1]} ${y}</span><span class="num">${eur(g.reduce((s,e)=>s+e.amount,0))}</span></div>
      <div class="list">${g.map(e=>{const c=CATS.find(c=>c.id===e.cat)||CATS[7];
        return `<div class="swipe"><div class="swipe-bg" aria-hidden="true">Fshi</div><button class="row" type="button" data-id="${e.id}">${icon(c.id,c.c)}
        <div><div class="t">${esc(e.note||c.n)}</div><div class="m">${fmtDate(e.date)} · ${c.n}${e.shop?' · '+esc(e.shop):''}${e.hasPhoto?'<svg class="clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-label="Ka foto"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>':''}</div></div>
        <span class="a num">${eur(e.amount)}</span></button></div>`}).join('')}</div></div>`}).join('');
  }
  // summary
  const byC=CATS.map(c=>({c,v:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maxC=byC.length?byC[0].v:1;
  $('byCat').innerHTML=byC.length?byC.map(x=>`<div class="cat-row"><span>${x.c.n}<span class="pct num">${Math.round(x.v/tot*100)}%</span></span><span class="num" style="font-weight:600">${eur(x.v)}</span>
    <div class="bar"><i style="width:${x.v/maxC*100}%;background:var(${x.c.c})"></i></div></div>`).join(''):'<div class="empty" style="padding:12px">Asnjë e dhënë ende.</div>';
  if(byC.length){
    const R0=52,C=2*Math.PI*R0;let off=0;
    let d=`<svg viewBox="0 0 140 140" role="img" aria-label="Ndarja sipas kategorisë"><circle cx="70" cy="70" r="${R0}" fill="none" stroke="var(--line)" stroke-width="16"/>`;
    byC.forEach(x=>{const len=x.v/tot*C;d+=`<circle cx="70" cy="70" r="${R0}" fill="none" stroke="var(${x.c.c})" stroke-width="16" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
    d+=`<text x="70" y="66" text-anchor="middle" fill="var(--muted)" font-size="11">Gjithsej</text><text x="70" y="84" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="700" font-family="ui-rounded,-apple-system,sans-serif">${eur0(tot)}</text></svg>`;
    d+='<div class="lg">'+byC.slice(0,5).map(x=>`<span><i style="background:var(${x.c.c})"></i>${x.c.n}</span>`).join('')+(byC.length>5?'<span style="color:var(--muted)">+ '+(byC.length-5)+' të tjera</span>':'')+'</div>';
    $('donut').innerHTML=d;$('donut').hidden=false;
  } else $('donut').hidden=true;
  renderMonths(ex);
  // settings
  $('projName').value=p.name;$('projBudget').value=p.budget||'';
  // views
  ['list','summary','settings'].forEach(v=>{$('view'+v[0].toUpperCase()+v.slice(1)).hidden=S.view!==v});
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===S.view));
  placeLens();
}

function renderMonths(ex){
  const keys=[...new Set(ex.map(e=>e.date.slice(0,7)))].sort().slice(-6);
  if(!keys.length){$('byMonth').innerHTML='<div class="empty" style="padding:12px">Asnjë e dhënë ende.</div>';return}
  const vals=keys.map(k=>ex.filter(e=>e.date.startsWith(k)).reduce((s,e)=>s+e.amount,0));
  const W=320,H=170,top=22,bottom=24,bw=Math.min(40,(W-20)/keys.length-14),max=Math.max(...vals);
  const step=(W-20)/keys.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Shpenzimet sipas muajit">`;
  svg+=`<defs><linearGradient id="ig" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F58529"/><stop offset=".5" stop-color="#DD2A7B"/><stop offset="1" stop-color="#8134AF"/></linearGradient></defs>`;
  svg+=`<line x1="0" x2="${W}" y1="${H-bottom}" y2="${H-bottom}" stroke="var(--line)"/>`;
  keys.forEach((k,i)=>{
    const h=(vals[i]/max)*(H-top-bottom),x=10+step*i+(step-bw)/2,y=H-bottom-h;
    const last=i===keys.length-1;
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="var(--accent)" opacity="${last?1:.45}"/>`;
    svg+=`<text class="v" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${vals[i]>=1000?(vals[i]/1000).toFixed(1).replace('.',',')+'k':Math.round(vals[i])}</text>`;
    svg+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${MSHORT[+k.slice(5)-1]}</text>`;
  });
  $('byMonth').innerHTML=svg+'</svg>';
}

const catOrder=()=>{const r=(S.recentCats||[]).filter(id=>CATS.some(c=>c.id===id));return r.map(id=>CATS.find(c=>c.id===id)).concat(CATS.filter(c=>!r.includes(c.id)))};
function showAmt(){
  const o=$('fAmount');if(!amt){o.textContent='0';o.classList.add('zero');return}
  const [i,d]=amt.split(',');o.textContent=(i||'0').replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d!==undefined?','+d:'');o.classList.remove('zero');
}
function key(k){
  if(k==='del')amt=amt.slice(0,-1);
  else if(k===','){if(!amt.includes(','))amt=(amt||'0')+','}
  else{const [i,d]=amt.split(',');if(d!==undefined){if(d.length<2)amt+=k}else if(i.length<9)amt=(amt==='0'?'':amt)+k}
  $('fErr').hidden=true;showAmt();
}
function setThumb(blob){
  if(thumbURL){URL.revokeObjectURL(thumbURL);thumbURL=null}
  const has=!!blob;$('fThumb').hidden=!has;$('fPhotoDel').hidden=!has;$('fPhotoLbl').textContent=has?'Ndrysho foton':'Shto foto të faturës';
  if(has){thumbURL=URL.createObjectURL(blob);$('fThumb').src=thumbURL}
}
function openForm(e){
  editing=e||null;photoChange=null;
  $('formTitle').textContent=e?'Ndrysho shpenzimin':'Shpenzim i ri';
  amt=e?String(e.amount.toFixed(2)).replace('.',',').replace(/,00$/,''):'';showAmt();
  $('fNote').value=e?e.note:'';$('fShop').value=e?e.shop:'';
  $('fDate').value=e?e.date:today();
  fCat=e?e.cat:(filter!=='all'?filter:((S.recentCats||[])[0]||'materiale'));
  renderCats();$('fCats').scrollLeft=0;
  $('fErr').hidden=true;$('fDelete').hidden=!e;
  setThumb(null);if(e&&e.hasPhoto)DB.get(e.id).then(b=>{if(editing===e&&photoChange===null)setThumb(b)}).catch(()=>{});
  $('form').style.transform='';$('scrim').hidden=false;
}
function renderCats(){
  $('fCats').innerHTML=catOrder().map(c=>`<button class="chip" type="button" role="radio" data-c="${c.id}" aria-checked="${fCat===c.id}" aria-pressed="${fCat===c.id}">${c.n}</button>`).join('');
}
const closeForm=()=>{$('scrim').hidden=true;editing=null;setThumb(null)};

$('form').addEventListener('submit',ev=>{
  ev.preventDefault();
  const a=parseFloat(amt.replace(',','.'));
  if(!(a>0)){$('fErr').textContent='Shkruaj shumën me tastierën, p.sh. 125,50.';$('fErr').hidden=false;return}
  if(!$('fDate').value){$('fErr').textContent='Zgjidh datën.';$('fErr').hidden=false;return}
  const data={amount:Math.round(a*100)/100,date:$('fDate').value,cat:fCat,note:$('fNote').value.trim(),shop:$('fShop').value.trim()};
  const p=proj();let e=editing;
  if(e){Object.assign(e,data);delete e.sample;toast('U ruajt')}
  else{e={id:uid(),...data};p.expenses.push(e);toast('U shtua '+eur(data.amount))}
  if(photoChange==='remove'){e.hasPhoto=false;DB.del(e.id).catch(()=>{})}
  else if(photoChange){e.hasPhoto=true;DB.put(e.id,photoChange).catch(()=>{e.hasPhoto=false;save();render();toast('Fotoja nuk u ruajt')})}
  S.recentCats=[fCat].concat((S.recentCats||[]).filter(x=>x!==fCat)).slice(0,8);
  save();closeForm();render();
});
$('pad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if($('scrim').hidden||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===','||e.key==='.')key(',');else if(e.key==='Backspace')key('del');
  else if(e.key==='Escape')closeForm();else if(e.key==='Enter')$('form').requestSubmit();else return;
  e.preventDefault();
});
$('fCats').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){fCat=b.dataset.c;renderCats()}});
$('fPhoto').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  shrink(f).then(b=>{photoChange=b;setThumb(b)}).catch(()=>toast('Kjo foto nuk mund të hapet'))};
$('fPhotoDel').onclick=()=>{photoChange='remove';setThumb(null)};
$('fThumb').onclick=()=>{$('viewerImg').src=$('fThumb').src;$('viewer').hidden=false};
$('viewer').onclick=()=>{$('viewer').hidden=true};
$('closeForm').onclick=closeForm;
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeForm()});
$('fDelete').onclick=()=>{const e=editing;closeForm();removeExpense(e)};

// Drag the sheet down to close it.
(function(){
  const sh=$('form');let y0=null,dy=0;
  const start=e=>{if(!e.target.closest('#grab,#sheetHead')||e.target.closest('button'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'};
  sh.addEventListener('touchstart',start,{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;e.preventDefault()},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0===null)return;y0=null;sh.style.transition='transform .2s ease';
    if(dy>110){sh.style.transform='translateY(100%)';setTimeout(()=>{closeForm();sh.style.transform='';sh.style.transition=''},180)}else sh.style.transform=''});
})();

// Swipe a row left to delete it.
(function(){
  const box=$('months');let row=null,x0=0,y0=0,dx=0,mode=null,justSwiped=false;
  box.addEventListener('touchstart',e=>{row=e.target.closest('.row');if(!row)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;mode=null},{passive:true});
  box.addEventListener('touchmove',e=>{if(!row)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!mode){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my))mode='x';else if(Math.abs(my)>10){mode='y';row=null;return}else return}
    dx=Math.min(0,mx);row.style.transition='none';row.style.transform=`translateX(${dx}px)`;e.preventDefault()},{passive:false});
  box.addEventListener('touchend',()=>{if(!row||mode!=='x'){row=null;return}const r=row;row=null;justSwiped=true;setTimeout(()=>justSwiped=false,350);
    r.style.transition='';
    if(-dx>r.offsetWidth*.35){r.style.transform='translateX(-100%)';const ex=proj().expenses.find(x=>x.id===r.dataset.id);setTimeout(()=>ex&&removeExpense(ex),200)}
    else r.style.transform=''});
  box.addEventListener('click',e=>{if(justSwiped){e.stopImmediatePropagation();e.preventDefault()}},true);
})();
$('addBtn').onclick=()=>openForm();
$('months').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openForm(proj().expenses.find(x=>x.id===r.dataset.id))});
$('filterChips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}});
const setView=v=>{if(S.view===v)return;S.view=v;save();render();window.scrollTo(0,0)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));
// Bottom bar: hold and slide a finger across it to switch pages (like Instagram on iOS).
function tabBox(t){const a=$('tabIn').getBoundingClientRect(),r=t.getBoundingClientRect();return{l:r.left-a.left,w:r.width,c:r.left-a.left+r.width/2}}
function placeLens(){const t=document.querySelector('.tab[aria-selected="true"]');if(!t)return;const b=tabBox(t),w=Math.max(b.w+20,76);
  const L=$('lens');L.style.width=w+'px';L.style.left=(b.c-w/2)+'px'}
addEventListener('resize',placeLens);
(function(){
  const bar=$('tabIn'),L=$('lens'),tabs=[...document.querySelectorAll('.tab')];let on=false,moved=false,x0=0;
  const nearest=x=>{const a=bar.getBoundingClientRect();let best=null,d=1e9;tabs.forEach(t=>{const b=tabBox(t),dd=Math.abs(a.left+b.c-x);if(dd<d){d=dd;best=t}});return best};
  const follow=x=>{const a=bar.getBoundingClientRect(),t=nearest(x),w=Math.max(tabBox(t).w+20,76);
    const lo=tabBox(tabs[0]).c-w/2,hi=tabBox(tabs[tabs.length-1]).c-w/2;
    L.style.width=w+'px';L.style.left=Math.min(hi,Math.max(lo,x-a.left-w/2))+'px';setView(t.dataset.view)};
  bar.addEventListener('touchstart',e=>{if(e.target.closest('.fab')||!e.target.closest('.tab'))return;on=true;moved=false;x0=e.touches[0].clientX},{passive:true});
  bar.addEventListener('touchmove',e=>{if(!on)return;const x=e.touches[0].clientX;
    if(!moved&&Math.abs(x-x0)<6)return;
    if(!moved){moved=true;L.classList.add('drag');bar.classList.add('dragging')}
    follow(x);e.preventDefault()},{passive:false});
  const end=()=>{if(!on)return;on=false;if(moved){L.classList.remove('drag');bar.classList.remove('dragging');placeLens()}};
  bar.addEventListener('touchend',end);bar.addEventListener('touchcancel',end);
})();
$('clearSample').onclick=()=>{S.projects.forEach(p=>p.expenses=p.expenses.filter(e=>!e.sample));save();render();toast('Shembujt u fshinë')};
function newProject(){
  const n=S.projects.length+1;
  const p={id:uid(),name:n===2?'Shpenzime ditore':'Projekt '+n,budget:0,expenses:[]};
  S.projects.push(p);S.current=p.id;S.view='settings';filter='all';save();render();
  setTimeout(()=>{$('projName').focus();$('projName').select()},50);toast('Projekti u krijua');
}
$('projSel').onchange=e=>{if(e.target.value==='__new')newProject();else{S.current=e.target.value;filter='all';save();render()}};
$('newProj').onclick=newProject;
$('saveProj').onclick=()=>{const p=proj();p.name=$('projName').value.trim()||p.name;p.budget=parseFloat(String($('projBudget').value).replace(',','.'))||0;save();render();toast('Projekti u ruajt')};
function download(name,text,type){
  const blob=new Blob(['﻿'+text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
$('pdfBtn').onclick=()=>{
  const p=proj();const ex=p.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const tot=ex.reduce((s,e)=>s+e.amount,0);
  const cn=id=>(CATS.find(c=>c.id===id)||CATS[7]).n;
  const dfull=s=>{const [y,m,d]=s.split('-');return +d+' '+MONTHS[+m-1]+' '+y};
  const byC=CATS.map(c=>({n:c.n,v:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0),k:ex.filter(e=>e.cat===c.id).length})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const kpi=(l,v)=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`;
  let h=`<h1>Raport i shpenzimeve · ${esc(p.name)}</h1><p class="meta">Krijuar më ${dfull(today())}${ex.length?' · periudha '+dfull(ex[0].date)+' – '+dfull(ex[ex.length-1].date):''}</p>`;
  h+='<div class="kpis">'+kpi('Shpenzuar gjithsej',eur(tot))+kpi('Numri i shpenzimeve',ex.length)+(p.budget>0?kpi(tot<=p.budget?'Mbeten nga buxheti':'Tejkaluar buxheti',eur(Math.abs(p.budget-tot))+' <small style="font-weight:400;color:#555">nga '+eur0(p.budget)+'</small>'):'')+'</div>';
  h+='<h2>Sipas kategorisë</h2><table><thead><tr><th>Kategoria</th><th class="r">Shpenzime</th><th class="r">%</th><th class="r">Shuma</th></tr></thead><tbody>'+
    byC.map(x=>`<tr><td>${x.n}</td><td class="r">${x.k}</td><td class="r">${tot?Math.round(x.v/tot*100):0}%</td><td class="r">${eur(x.v)}</td></tr>`).join('')+
    `</tbody><tfoot><tr><td>Gjithsej</td><td class="r">${ex.length}</td><td class="r">100%</td><td class="r">${eur(tot)}</td></tr></tfoot></table>`;
  h+='<h2>Të gjitha shpenzimet</h2><table><thead><tr><th>Data</th><th>Përshkrimi</th><th>Kategoria</th><th>Dyqani / Punëtori</th><th class="r">Shuma</th></tr></thead><tbody>';
  let cur='';
  ex.forEach(e=>{const k=e.date.slice(0,7);
    if(k!==cur){cur=k;const mt=ex.filter(x=>x.date.startsWith(k)).reduce((s,x)=>s+x.amount,0);const [y,m]=k.split('-');
      h+=`<tr class="m"><td colspan="4" style="text-transform:capitalize">${MONTHS[+m-1]} ${y}</td><td class="r">${eur(mt)}</td></tr>`}
    h+=`<tr><td style="white-space:nowrap">${fmtDate(e.date)}</td><td>${esc(e.note||'')}</td><td>${cn(e.cat)}</td><td>${esc(e.shop||'')}</td><td class="r">${eur(e.amount)}</td></tr>`});
  h+=`</tbody><tfoot><tr><td colspan="4">Gjithsej</td><td class="r">${eur(tot)}</td></tr></tfoot></table><p class="foot">Financat</p>`;
  $('report').innerHTML=h;
  const old=document.title;document.title='Financat-'+p.name+'-'+today();
  setTimeout(()=>{window.print();setTimeout(()=>document.title=old,1000)},50);
};
$('exportBtn').onclick=()=>{
  const p=proj();const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=['Data;Shuma (€);Kategoria;Përshkrimi;Dyqani/Punëtori'].concat(p.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>
    [e.date,e.amount.toFixed(2).replace('.',','),q((CATS.find(c=>c.id===e.cat)||CATS[7]).n),q(e.note),q(e.shop)].join(';')));
  download('Financat-'+p.name.replace(/[^\wëçËÇ-]+/g,'_')+'-'+today()+'.csv',lines.join('\r\n'),'text/csv;charset=utf-8');
};
$('backupBtn').onclick=async()=>{
  const out=JSON.parse(JSON.stringify(S));out.photos={};
  for(const p of S.projects)for(const e of p.expenses)if(e.hasPhoto){try{const b=await DB.get(e.id);if(b)out.photos[e.id]=await blobToData(b)}catch(x){}}
  download('Financat-kopje-'+today()+'.json',JSON.stringify(out),'application/json');S.lastBackup=today();save();
};
let pending=null;
$('restoreIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(String(r.result).replace(/^﻿/,''));if(!Array.isArray(d.projects))throw 0;
    pending=d;const n=d.projects.reduce((s,p)=>s+p.expenses.length,0);
    $('restoreMsg').textContent='Skedari ka '+d.projects.length+' projekt(e) dhe '+n+' shpenzime. Të dhënat aktuale do të zëvendësohen.';
    $('restoreBox').hidden=false}catch(x){toast('Ky skedar nuk është kopje e Financat')}
    e.target.value=''};
  r.readAsText(f);
};
$('restoreYes').onclick=async()=>{if(!pending)return;const d=pending;pending=null;const ph=d.photos||{};delete d.photos;
  for(const id in ph){try{await DB.put(id,await dataToBlob(ph[id]))}catch(x){}}
  S=d;save();$('restoreBox').hidden=true;render();toast('Të dhënat u rikthyen')};
$('restoreNo').onclick=()=>{pending=null;$('restoreBox').hidden=true};
// Some iOS versions draw a home-screen app under the status bar but report a 0 safe-area inset.
(function(){
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!standalone)return;
  const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden';
  document.body.appendChild(probe);
  if(probe.offsetHeight===0)document.documentElement.style.setProperty('--sat',(screen.height>=900?62:screen.height>=812?50:20)+'px');
  probe.remove();
})();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  // A new version took over: reload once so the screen shows it.
  let reloaded=false;
  if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
}
render();
})();
